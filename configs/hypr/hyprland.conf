#autogenerated = 1 # remove this line to remove the warning

source=~/.config/hypr/rose-pine.conf

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=eDP-1,highres,auto,1.3333
monitor=eDP-1,highres,auto,1.5
monitor=,prefered,auto,auto

xwayland {
  force_zero_scaling = true
}


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = foot
$fileManager = nautilus
$menu = fuzzel


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = waybar
#exec-once = xhost +SI:localuser:root
#exec-once = xrdb -merge ~/.Xresources
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data

# launch hypridle
exec-once = hypridle
exec-once = hyprsunset

# Start polkit agent
#exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = systemctl --user start hyprpolkitagent

exec-once = killall -e xdg-desktop-portal-hyprland
exec-once = killall -e xdg-desktop-portal-wlr
exec-once = killall xdg-desktop-portal
exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = /usr/lib/xdg-desktop-portal &
#exec-once = brave --start-fullscreen

exec-once = pamac-tray-plasma &
exec-once = swaync

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = GDK_SCALE,1

env = QT_QPA_PLATFORMTHEME,qt5ct
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
#env = HYPRSHOT_DIR,/tmp
#env = GTK_THEME,'Adwaita-dark'
# exec = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita"
# exec = gsettings set org.gnome.desktop.interface color-scheme "default"

env = CLIPHIST_MAX_ITEMS,100

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 1
    gaps_out = 0

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $rose $pine $love $iris 90deg
    col.inactive_border =  $muted

    #Set to true enable resizing windows by clicking and dragging on borders and gaps
resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}
group {
    col.border_active = $rose $love $iris 90deg
    groupbar {
#        col.active = $muted
	# col.inactive = black
	scrolling = false
  indicator_height = 2
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 1

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
enabled = false
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    #left_handed = true
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.2
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
#gestures {
#    workspace_swipe = true
#    workspace_swipe_fingers = 4
#}

gesture = 4, horizontal, workspace
gesture = 3, swipe, dispatcher, focuscurrentorlast

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = usb-optical-mouse
    left_handed = true
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = CTRL+ALT, T, exec, $terminal
bind = ALT, f4, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, $mainMod_L, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# window fullscreen
bind = ALT SHIFT, F,fullscreen
bind = $mainMod, W, exec, /mnt/dataDrive/fedora-scripts-and-configs/scripts/waybarHandler.sh


# Brightness control
bind=,XF86MonBrightnessDown,exec,brightnessctl set 5%-
bind=,XF86MonBrightnessUp,exec,brightnessctl set 5%+

# Volume control
binde =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
binde =, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bind =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Media Control
bindl=, XF86AudioPlay, exec, playerctl play-pause
bindl=, XF86AudioNext, exec, playerctl next 
bindl=, XF86AudioPrev, exec, playerctl previous



# hyprshot
# Screenshot active monitor
bind = , PRINT, exec, hyprshot -m output -m active --clipboard-only
# Screenshot a region
bind = $mainMod $shiftMod, S, exec, hyprshot -m region --freeze --clipboard-only

# Btop
binds = Control_L&Shift_L, Escape, exec, hyprctl dispatch exec [float] 'foot -T "btop" btop'

# Hyprlock
bind = $mainMod, L, exec, hyprlock

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
#bind = $mainMod, 1, execr, hyprctl dispatch -- workspace $(hyprctl monitors | grep active | awk '{print $3}')\
#bind = $mainMod, 1, execr, bash workspaceSwitcher.sh 1
#bind = $mainMod, 2, execr, bash workspaceSwitcher.sh  2
#bind = $mainMod, 3, execr, bash workspaceSwitcher.sh  3
#bind = $mainMod, 4, execr, bash workspaceSwitcher.sh  4
#bind = $mainMod, 5, execr, bash workspaceSwitcher.sh  5
#bind = $mainMod, 6, execr, bash workspaceSwitcher.sh  6
#bind = $mainMod, 7, execr, bash workspaceSwitcher.sh  7
#bind = $mainMod, 8, execr, bash workspaceSwitcher.sh  8
#bind = $mainMod, 9, execr, bash workspaceSwitcher.sh  9
#bind = $mainMod, 0, execr, bash workspaceSwitcher.sh  10

#bind = $mainMod, 1, workspace, 1
#bind = $mainMod, 2, workspace, 2
#bind = $mainMod, 3, workspace, 3
#bind = $mainMod, 4, workspace, 4
#bind = $mainMod, 5, workspace, 5
#bind = $mainMod, 6, workspace, 6
#bind = $mainMod, 7, workspace, 7
#bind = $mainMod, 8, workspace, 8
#bind = $mainMod, 9, workspace, 9
#bind = $mainMod, 0, workspace, 10
# Switch workspaces with ctrl + alt + left/right
#bind = CTRL ALT, left, workspace, e-1
#bind = CTRL ALT, right, workspace, e+1


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Groups
bind = $mainMod, S, togglegroup
bind = $mainMod, Tab, changegroupactive

# Cycle through windows with Alt + Tab
bind = ALT, Tab, focuscurrentorlast,
bind = ALT, Tab, bringactivetotop,

# Scroll through existing workspaces with mainMod + scroll
#bind = $mainMod, mouse_down, workspace, e+1
#bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
#bindm = $mainMod, mouse:273, resizewindow
binde = $mainMod SHIFT, right, resizeactive, 10 0
binde = $mainMod SHIFT, left, resizeactive, -10 0
binde = $mainMod SHIFT, up, resizeactive, 0 -10
binde = $mainMod SHIFT, down, resizeactive, 0 10

bind = $mainMod CTRL SHIFT, left, movewindow, l
bind = $mainMod CTRL SHIFT, right, movewindow, r
bind = $mainMod CTRL SHIFT, up, movewindow, u
bind = $mainMod CTRL SHIFT, down, movewindow, d

bind = $mainMod CTRL, left, workspace, e-1
bind = $mainMod CTRL, right, workspace, e+1

# Cliphist
# bind = SUPER, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mainMod, V, exec, /mnt/dataDrive/fedora-scripts-and-configs/scripts/cliphist-fuzzel-img

# Bring up (wifi) menu
# bind = $mainMod, A, exec, hyprctl dispatch exec [float] 'foot --window-size-chars=50x20 nmtui'
bind = $mainMod, A, exec, swaync-client -t -sw

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrule = float,class:^(kitty)$,title:^(kitty)$

windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .* # You'll probably like this.
}

windowrule {
  name = windowrule-2
  border_size = 0
  match:workspace = w[t1]
}

windowrule {
  name = windowrule-3
  float = on
  match:class = ^(xdg-desktop-portal-gtk)$
}

windowrule {
  name = windowrule-4
  float = on
  match:class = (thunderbird)
  match:initial_title = (Calendar\sReminders)
}

windowrule {
  name = windowrule-5
  float = on
  match:class = (thunderbird)
  match:initial_title = (Edit\sItem)
}

windowrule {
  name = windowrule-6
  move = ((monitor_w*0)) ((monitor_h*0))
  size = 451 500
  float = on
  match:initial_title = (Google\sCalendar)
}

windowrule {
  name = windowrule-7
  float = on
  match:initial_title = (File\sOperation\sProgress)
}

#windowrule = float, title:^(Picture in picture)$
#windowrule = pin, title:^(Picture in picture)$
#windowrule = move 0 0,size 450 260,title:^(Picture in picture)$
windowrule {
  name = windowrule-8
  float = on
  move = (754) (0)
  match:initial_class = brave-fckijfmfdgollpeaehckgohhlnjaflim-Default
}

windowrule {
  name = windowrule-9
  size = 522 716
  match:class = brave-fckijfmfdgollpeaehckgohhlnjaflim-Default
}

